<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BatCom · Mapa de participación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@700&family=IBM+Plex+Mono:wght@400&family=Source+Serif+4:wght@400;600&display=swap">
<style>
  /* Colores y tipografías de la página de BatCom */
  :root{
    --fg:#1a2b30; --soft:#4d6065; --line:#c6d1ca; --vacio:#dbe3da; --borde:#f9fbf6;
    --tip-bg:#f9fbf6; --aviso:#9a5a00; --num:#12303a;
    --display:"Fira Sans Extra Condensed","Arial Narrow",Arial,sans-serif;
    --body:"Source Serif 4",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --fg:#e8efea; --soft:#a9bdb9; --line:#2f4f58; --vacio:#1f3c46; --borde:#0e2129; --tip-bg:#15303a; --aviso:#eeb04a; --num:#eeb04a; color-scheme:dark; }
  }
  :root[data-theme="dark"]{ --fg:#e8efea; --soft:#a9bdb9; --line:#2f4f58; --vacio:#1f3c46; --borde:#0e2129; --tip-bg:#15303a; --aviso:#eeb04a; --num:#eeb04a; color-scheme:dark; }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--fg);font-family:var(--body)}
  .batcom-mapa{max-width:720px;margin:0 auto;padding:0}
  .cifras{display:flex;gap:40px;flex-wrap:wrap;margin:0 0 6px;padding-block:14px;border-block:1px solid var(--line)}
  .cifra b{display:block;font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--num);font-variant-numeric:tabular-nums}
  .cifra span{font-family:var(--mono);font-size:13px;color:var(--soft)}
  .actualizado{font-family:var(--mono);font-size:12px;color:var(--soft);margin:6px 0 0}
  .lienzo{position:relative}
  svg{width:100%;height:auto;display:block}
  .depto{stroke:var(--borde);stroke-width:.8;cursor:pointer}
  .depto:hover{stroke:var(--fg);stroke-width:1.4}
  circle.depto{stroke:var(--soft);stroke-width:1}
  .recuadro{fill:none;stroke:var(--line);stroke-width:1}
  .rotulo-recuadro{font-family:var(--mono);font-size:10px;fill:var(--soft)}
  .tip{position:absolute;pointer-events:none;background:var(--tip-bg);color:var(--fg);border:1px solid var(--line);
       border-radius:3px;padding:6px 9px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.15);opacity:0;white-space:nowrap}
  .tip b{font-family:var(--display);font-size:18px}
  .leyenda{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--soft);flex-wrap:wrap;margin-top:6px}
  .leyenda i{display:inline-block;width:18px;height:12px;border-radius:2px}
  .aviso{font-family:var(--mono);font-size:13px;color:var(--aviso);border:1px solid currentColor;border-radius:3px;padding:8px 10px;margin:10px 0}
  #depuracion{font-size:14px;border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin-top:10px;display:none}
  #depuracion td{padding:2px 8px 2px 0;vertical-align:top}
</style>
</head>
<body>
<div class="batcom-mapa">
  <div class="cifras">
    <div class="cifra"><b id="n-personas">–</b><span id="l-personas">personas interesadas</span></div>
    <div class="cifra"><b id="n-deptos">–</b><span id="l-deptos">departamentos con datos</span></div>
  </div>
  <p class="actualizado" id="actualizado"></p>
  <div id="aviso"></div>
  <div class="lienzo">
    <svg id="mapa" viewBox="0 0 600 720" role="img" aria-label="Mapa de Colombia con el número de participantes por departamento"></svg>
    <div class="tip" id="tip"></div>
  </div>
  <div class="leyenda" id="leyenda"></div>
  <div id="depuracion"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

document.documentElement.lang = EN ? "en" : "es";

document.getElementById("l-deptos").textContent = TXT.deptos;

}

  "95": ["guaviare","san jose del guaviare"],
  "97": ["vaupes","mitu"],
  "99": ["vichada","puerto carreno"]
};
// Regiones y nombres de municipios que contienen el nombre de OTRO departamento.
// Se revisan antes que los departamentos (gana la frase más larga).
// Lista vacía [] = se ignora (no suma a ningún departamento).
const ESPECIALES = {
  "eje cafetero": ["17","66","63"], "zona cafetera": ["17","66","63"],
  "triangulo del cafe": ["17","66","63"], "paisaje cultural cafetero": ["17","66","63"],
  "valle de aburra": ["05"], "valle de san juan": ["73"], "valle del guamuez": ["86"],
  "valle de tenza": ["15"], "santander de quilichao": ["19"], "puerto santander": ["54"],
  "san andres de sotavento": ["23"], "san andres de cuerquia": ["05"],
  "magdalena medio": [], "rio magdalena": [], "rio cauca": [], "rio meta": [],
  "el valle": []
};
const PATRONES = [
    ...Object.entries(ALIAS).flatMap(([cod, vs]) => vs.map(v => [norm(v), [cod]])),
    ...Object.entries(ESPECIALES).map(([v, cods]) => [norm(v), cods])
  ]
  .sort((a, b) => b[0].length - a[0].length)
  .map(([v, cods]) => [new RegExp("(^| )" + v + "(?= |$)", "g"), cods]);

function reconocer(texto) {
  let t = " " + norm(texto) + " ";
  const encontrados = new Set();
  for (const [re, cods] of PATRONES) {
    re.lastIndex = 0;
    if (re.test(t)) { cods.forEach(c => encontrados.add(c)); t = t.replace(re, " "); }
  }
  return { codigos: [...encontrados] };
}

// --- Datos de ejemplo (solo si no hay CSV_URL) ---------------------
const EJEMPLO = ["Antioquia","Valle","valle del cauca y cauca","Santander, Boyacá","Meta",
  "Bogotá","Chocó","Nariño","Antioquia - Caldas","Magdalena","Caquetá","Tolima, Huila","Antioquia","San Andrés"];

// --- Dibujo --------------------------------------------------------
const svg = d3.select("#mapa"), W = 600, H = 720;
const tip = document.getElementById("tip");
const continente = { type:"FeatureCollection", features: GEO.features.filter(f => f.properties.code !== "88") };
const islas = GEO.features.filter(f => f.properties.code === "88");

const proj = d3.geoMercator().fitExtent([[10, 10], [W - 10, H - 10]], continente);
const camino = d3.geoPath(proj);
const recuadro = [[14, 14], [104, 124]];
const projIsla = d3.geoMercator().fitExtent([[recuadro[0][0]+12, recuadro[0][1]+12],[recuadro[1][0]-12, recuadro[1][1]-24]],
                                            { type:"FeatureCollection", features: islas });
const caminoIsla = d3.geoPath(projIsla);

function pintar(conteo, total) {
  const max = Math.max(1, d3.max(Object.values(conteo)) || 1);
  const oscuro = getComputedStyle(document.documentElement).colorScheme === "dark";
  const color = d3.scaleSequential([0, max], oscuro ? d3.interpolateRgb("#4b7a6f", "#eeb04a") : d3.interpolateRgb("#b9d2c3", "#12303a"));
  const relleno = f => conteo[f.properties.code] ? color(conteo[f.properties.code]) : "var(--vacio)";
  const nombre = f => f.properties.name;

  svg.selectAll("*").remove();
  const g = svg.append("g");
  const dibujar = (sel, path) => sel.join("path").attr("class","depto").attr("d", path).attr("fill", relleno)
    .on("mousemove", (ev, f) => mostrar(ev, f))
    .on("mouseleave", () => tip.style.opacity = 0);

  function mostrar(ev, f) {
      const n = conteo[f.properties.code] || 0;
      tip.innerHTML = `<b>${nombre(f)}</b><br>${n === 0 ? TXT.sin : n + (n === 1 ? TXT.p1 : TXT.pN)}`;
      const r = svg.node().parentNode.getBoundingClientRect();
      let x = ev.clientX - r.left + 12, y = ev.clientY - r.top + 12;
      if (x > r.width - 170) x -= 190;
      tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.opacity = 1;
  }

  dibujar(g.selectAll("path.c").data(continente.features), camino);
  g.append("rect").attr("class","recuadro").attr("x",recuadro[0][0]).attr("y",recuadro[0][1])
   .attr("width",recuadro[1][0]-recuadro[0][0]).attr("height",recuadro[1][1]-recuadro[0][1]).attr("rx",4);
  // Las islas son diminutas: se marcan con un círculo en cada isla
  const puntos = islas.flatMap(f => f.geometry.coordinates.map(poly => ({ f, c: projIsla(d3.geoCentroid({type:"Polygon", coordinates: poly})) })));
  g.selectAll("path.i").data(islas).join("path").attr("d", caminoIsla).attr("fill", "#999");
  const circ = g.selectAll("circle.depto").data(puntos).join("circle").attr("class","depto")
    .attr("cx", d => d.c[0]).attr("cy", d => d.c[1]).attr("r", 8);
  circ.attr("fill", d => relleno(d.f))
    .on("mousemove", (ev, d) => mostrar(ev, d.f)).on("mouseleave", () => tip.style.opacity = 0);
  g.append("text").attr("class","rotulo-recuadro").attr("x",(recuadro[0][0]+recuadro[1][0])/2)
   .attr("y",recuadro[1][1]-8).attr("text-anchor","middle").text(TXT.islas);

  // cifras
  const nDeptos = Object.keys(conteo).length;
  animarNumero("n-personas", total);
  animarNumero("n-deptos", nDeptos);

  // leyenda
  const pasos = max <= 4 ? d3.range(1, max + 1) : [1, Math.round(max/3), Math.round(2*max/3), max];
  document.getElementById("leyenda").innerHTML =
    `<i style="background:var(--vacio)"></i>0` +
    [...new Set(pasos)].map(v => `<i style="background:${color(v)}"></i>${v}`).join("") +
    `<span>&nbsp;${TXT.ley}</span>`;
  setTimeout(avisarAltura, 50);
}

function animarNumero(id, fin) {
  const el = document.getElementById(id);
  d3.select(el).transition().duration(900).tween("text", () => {
    const i = d3.interpolateRound(0, fin); return t => el.textContent = i(t);
  });
}

function procesar(respuestas) {
  const conteo = {}, filas = [];
  let total = 0;
  for (const r of respuestas) {
    if (!r || !norm(r)) continue;
    const { codigos } = reconocer(r);
    if (codigos.length) total++;                 // respuestas sin departamento (p. ej. "probando") no cuentan
    codigos.forEach(c => conteo[c] = (conteo[c] || 0) + 1);
    filas.push([r, codigos.map(c => NOMBRES[c]).join(", ")]);
  }
  pintar(conteo, total);
  // Modo revisión: añade ?revisar al final de la dirección para ver cómo se leyó cada respuesta
  if (location.search.includes("revisar")) {
    const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    const d = document.getElementById("depuracion");
    d.style.display = "block";
    d.innerHTML = "<b>Cómo se leyó cada respuesta</b> (en rojo: no se encontró ningún departamento)<br>" +
      "<table>" + filas.map(([r, ds]) =>
        `<tr><td>${esc(r)}</td><td style="color:${ds ? "#2E5E4E" : "#b00020"}">→ ${ds || "sin departamento"}</td></tr>`).join("") + "</table>";
    setTimeout(avisarAltura, 50);
  }
}

if (!CSV_URL) {
  document.getElementById("aviso").innerHTML = '<div class="aviso">' + TXT.ejemplo + '</div>';
  procesar(EJEMPLO);
} else {
  fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(txt => {
      const filas = d3.csvParseRows(txt).slice(1);           // quita el encabezado
      procesar(filas.map(f => f[COLUMNA]));
      document.getElementById("actualizado").textContent =
        TXT.act;
    })
    .catch(() => {
      document.getElementById("aviso").innerHTML = '<div class="aviso">' + TXT.error + '</div>';
      pintar({}, 0);
    });
}
</script>
